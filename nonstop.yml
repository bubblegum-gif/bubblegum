name: Bubblegum Non-Stop FREE
on:
  schedule:
    - cron: '0 8,15,20 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Asenna FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Asenna kirjastot
        run: pip install -r requirements.txt
      - name: Generoi ja auto-upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot_nonstop.py
        run: python bot_nonstop.py
      - name: Tallenna varmuuskopio
        uses: actions/upload-artifact@v4
        with:
          name: bubblegum-video-${{ github.run_number }}
          path: output_videos/*.mp4
          retention-days: 7
